[application]

# Android (docs/ANDROID.md): our activity and manifest replace dx's defaults.
# Native playback is the Gradle module android/rustysound-audio, which dx
# bundles through the manganis::ffi declaration in native_android_backend.rs.
android_main_activity = "android/MainActivity.kt"
android_manifest = "android/AndroidManifest.xml"

# Desktop app configuration
[application.desktop]

# The name of the app
name = "RustySound"

# The icon to use for the app (PNG, ICNS, or ICO)
icon = "assets/web-app-manifest-512x512.png"

# Mobile app configuration  
[application.mobile]

# The name of the app
name = "RustySound"

# The icon to use for the app (PNG)
icon = "assets/web-app-manifest-512x512.png"

# iOS-specific runtime metadata.
[ios]
# Ensure iOS keeps audio playback active while the app is backgrounded.
background_modes = ["audio"]

# Adopt the UIScene life cycle. Apps built with the iOS 27 SDK are killed at
# launch without this manifest ("UIScene life cycle is required for apps built
# with this SDK"). The delegate class is registered at startup by
# src/ios_scene.rs, which attaches tao's window to the scene; keep the class
# name in sync with SCENE_DELEGATE_CLASS there.
#
# UIFileSharingEnabled + LSSupportsOpeningDocumentsInPlace show the app's
# Documents folder in the Files app (On My iPhone → RustySound) and in
# Finder; music put there plays "On This Device" (src/local_music).
#
# NSLocalNetworkUsageDescription + NSBonjourServices: finding speakers on
# the network (src/cast), asked the first time the Speakers list opens.
# SSDP (UPnP, Sonos) and the Cast mDNS query also need Apple's
# com.apple.developer.networking.multicast entitlement in the provisioning
# profile; without it the searches find nothing.
[ios.raw]
info_plist = """
	<key>UIFileSharingEnabled</key>
	<true/>
	<key>LSSupportsOpeningDocumentsInPlace</key>
	<true/>
	<key>NSLocalNetworkUsageDescription</key>
	<string>RustySound uses your local network to stream from your media server and to play on speakers.</string>
	<key>NSBonjourServices</key>
	<array>
		<string>_googlecast._tcp</string>
	</array>
	<key>UIApplicationSceneManifest</key>
	<dict>
		<key>UIApplicationSupportsMultipleScenes</key>
		<false/>
		<key>UISceneConfigurations</key>
		<dict>
			<key>UIWindowSceneSessionRoleApplication</key>
			<array>
				<dict>
					<key>UISceneConfigurationName</key>
					<string>Default Configuration</string>
					<key>UISceneDelegateClassName</key>
					<string>RustySoundSceneDelegate</string>
				</dict>
			</array>
		</dict>
	</dict>
"""

[android]
min_sdk = 24
target_sdk = 35
compile_sdk = 35

[web.app]

# HTML title tag content
title = "RustySound"

# Base path for assets when deployed under a subdirectory
base_path = "/"

# include `assets` in web platform
[web.resource]

# Additional CSS style files
style = []

# Additional JavaScript files
script = []

[web.resource.dev]

# Javascript code file
# serve: [dev-server] only
script = []

[bundle]

# Bundle identifier for the app
identifier = "app.adarcher.rustysound"

# Bundle publisher
publisher = "AD-Archer"

# Display name for the app
name = "RustySound"

# Short name for the app
short_name = "RustySound"

# App category
category = "Music"

# Short description
short_description = "A music streaming client for Navidrome/Subsonic servers"

# Long description
long_description = "RustySound is a cross-platform music streaming client that connects to Navidrome and Subsonic-compatible servers."

# Copyright
copyright = "Copyright © 2026 AD-Archer"

# Icons for different platforms
icon = [
    "assets/web-app-manifest-512x512.png",
    "assets/web-app-manifest-192x192.png",
    "assets/favicon.ico",
    "assets/favicon.icns",
]

# No extra bundle resources: icons and the web manifest are bundled through asset!(),
# and the native builds compile the styles in (src/styles.rs).

# macOS specific settings
[bundle.macos]
minimum_system_version = "10.13"

# Windows specific settings
[bundle.windows]
webview_install_mode = { DownloadBootstrapper = { silent = false } }
