name: Build and Release

# Runs on pushes to prod and on v* tags (releases), or by hand from the Actions
# tab ("Run workflow"). Pull requests no longer trigger it: the Check workflow
# covers them, and a PR branch isn't allowed to deploy to GitHub Pages.
on:
  push:
    branches:
      - prod
    tags:
      - 'v*'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN for GitHub Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write
  packages: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      semver: ${{ steps.version.outputs.semver }}
    steps:
    - name: Resolve release version
      id: version
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          TAG="${GITHUB_REF_NAME}"
        else
          TAG="v3.1.${{ github.run_number }}"
        fi
        SEMVER="${TAG#v}"
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
        echo "Resolved version tag: ${TAG}"

  web-docker:
    needs: version
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Sync Cargo.toml version to release version
      run: |
        awk -v v='${{ needs.version.outputs.semver }}' '
          BEGIN { done=0 }
          !done && $0 ~ /^version = ".*"/ { print "version = \"" v "\""; done=1; next }
          { print }
        ' Cargo.toml > Cargo.toml.tmp
        mv Cargo.toml.tmp Cargo.toml
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - run: cargo install dioxus-cli --version 0.7.10 --locked
    - name: Build web app
      run: dx bundle --platform web --release
    - name: Prepare web assets
      run: |
        mkdir -p dist
        cp -r target/dx/rustysound/release/web/public/* dist/
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository_owner }}/rustysound
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix=sha-
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/prod' }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  web-pages:
    needs: version
    # The github-pages environment only accepts deployments from main and prod.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v7
    - name: Sync Cargo.toml version to release version
      run: |
        awk -v v='${{ needs.version.outputs.semver }}' '
          BEGIN { done=0 }
          !done && $0 ~ /^version = ".*"/ { print "version = \"" v "\""; done=1; next }
          { print }
        ' Cargo.toml > Cargo.toml.tmp
        mv Cargo.toml.tmp Cargo.toml
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - run: cargo install dioxus-cli --version 0.7.10 --locked
    - name: Build web app
      run: dx bundle --platform web --release
    - name: Prepare web assets for GitHub Pages
      run: |
        mkdir -p gh-pages
        cp -r target/dx/rustysound/release/web/public/* gh-pages/
        touch gh-pages/.nojekyll
    - name: Setup Pages
      uses: actions/configure-pages@v6
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: gh-pages/
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5

  apple-bundles:
    needs: version
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Sync Cargo.toml version to release version
      run: |
        awk -v v='${{ needs.version.outputs.semver }}' '
          BEGIN { done=0 }
          !done && $0 ~ /^version = ".*"/ { print "version = \"" v "\""; done=1; next }
          { print }
        ' Cargo.toml > Cargo.toml.tmp
        mv Cargo.toml.tmp Cargo.toml
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - run: cargo install dioxus-cli --version 0.7.10 --locked
    - name: Build macOS + iOS bundles
      env:
        APP_VERSION: ${{ needs.version.outputs.semver }}
        CREATE_MACOS_DMG: "0"
      run: ./scripts/bundle-apple.sh
    - name: Verify Apple bundle versions
      env:
        EXPECTED_APP_VERSION: ${{ needs.version.outputs.semver }}
      run: |
        set -euo pipefail

        IPA_PATH="$(find dist/apple/ios -maxdepth 1 -type f -name '*-unsigned.ipa' | head -n 1)"
        APP_PATH="$(find dist/apple/macos -maxdepth 1 -type d -name '*.app' | head -n 1)"

        if [[ -z "${IPA_PATH}" ]]; then
          echo "Unsigned IPA not found under dist/apple/ios." >&2
          exit 1
        fi

        if [[ -z "${APP_PATH}" ]]; then
          echo "macOS app bundle not found under dist/apple/macos." >&2
          exit 1
        fi

        export IPA_PATH APP_PATH EXPECTED_APP_VERSION
        python3 - <<'PY'
        import os
        import plistlib
        import re
        import zipfile


        def normalize(version: str) -> str:
            normalized = re.split(r"[-+]", version, maxsplit=1)[0]
            if not re.fullmatch(r"\d+(?:\.\d+){0,2}", normalized):
                raise SystemExit(f"Unsupported Apple bundle version: {version}")
            parts = normalized.split(".")
            parts.extend(["0"] * (3 - len(parts)))
            return ".".join(parts[:3])


        expected = normalize(os.environ["EXPECTED_APP_VERSION"])
        ipa_path = os.environ["IPA_PATH"]
        app_path = os.environ["APP_PATH"]

        with zipfile.ZipFile(ipa_path) as zf:
            info_member = next(
                (name for name in zf.namelist() if re.match(r"^Payload/[^/]+\.app/Info\.plist$", name)),
                None,
            )
            if info_member is None:
                raise SystemExit("IPA Info.plist not found")
            ipa_info = plistlib.loads(zf.read(info_member))

        with open(os.path.join(app_path, "Contents", "Info.plist"), "rb") as fh:
            mac_info = plistlib.load(fh)

        for label, info in (("IPA", ipa_info), ("macOS", mac_info)):
            short = str(info.get("CFBundleShortVersionString", ""))
            build = str(info.get("CFBundleVersion", ""))
            print(f"{label}: CFBundleShortVersionString={short} CFBundleVersion={build}")
            if short != expected or build != expected:
                raise SystemExit(
                    f"{label} bundle version mismatch: expected {expected}, got short={short}, build={build}"
                )
        PY
    - name: Sign macOS app (ad-hoc or notarized)
      env:
        MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
        MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        set -euo pipefail

        APP_PATH="$(find dist/apple/macos -maxdepth 1 -type d -name '*.app' | head -n 1)"
        APP_NAME="$(basename "$APP_PATH" .app)"
        DMG_PATH="dist/apple/macos/${APP_NAME}.dmg"
        CERT_PATH="$RUNNER_TEMP/macos-signing-cert.p12"
        KEYCHAIN_PATH="$RUNNER_TEMP/macos-signing.keychain-db"
        DO_NOTARIZE=0
        if [[ -n "${MACOS_CERT_P12_BASE64}" && -n "${MACOS_CERT_PASSWORD}" && -n "${MACOS_SIGNING_IDENTITY}" && -n "${APPLE_ID}" && -n "${APPLE_APP_SPECIFIC_PASSWORD}" && -n "${APPLE_TEAM_ID}" ]]; then
          DO_NOTARIZE=1
        fi

        if [[ "$DO_NOTARIZE" -eq 1 ]]; then
          echo "Signing and notarizing macOS app..."
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH" 2>/dev/null || printf '%s' "$MACOS_CERT_P12_BASE64" | base64 -D > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERT_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"

          APP_ZIP="$RUNNER_TEMP/${APP_NAME}-notarize.zip"
          ditto -c -k --keepParent "$APP_PATH" "$APP_ZIP"
          xcrun notarytool submit "$APP_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"
        else
          echo "Notarization secrets are missing. Using ad-hoc signing."
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep "$APP_PATH"
        fi

        DMG_STAGE_DIR="$(mktemp -d)"
        cp -R "$APP_PATH" "$DMG_STAGE_DIR/"
        cat > "$DMG_STAGE_DIR/INSTALL.txt" <<EOF
        RustySound macOS Install Instructions
        =====================================

        1. Drag ${APP_NAME}.app to Applications.
        2. Open ${APP_NAME}.app from Applications.
        3. If blocked by macOS, go to:
           System Settings > Privacy & Security > Open Anyway

        Terminal fallback:
        xattr -dr com.apple.quarantine /Applications/${APP_NAME}.app
        open /Applications/${APP_NAME}.app
        EOF

        rm -f dist/apple/macos/*.dmg
        for attempt in 1 2 3; do
          hdiutil detach "/Volumes/$APP_NAME" -force >/dev/null 2>&1 || true
          if hdiutil create -volname "$APP_NAME" -srcfolder "$DMG_STAGE_DIR" -ov -format UDZO "$DMG_PATH"; then
            break
          fi
          if [[ "$attempt" -eq 3 ]]; then
            echo "hdiutil create failed after 3 attempts."
            exit 1
          fi
          echo "hdiutil create failed (attempt $attempt/3); retrying..."
          sleep $((attempt * 2))
        done
        rm -rf "$DMG_STAGE_DIR"

        if [[ "$DO_NOTARIZE" -eq 1 ]]; then
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"
        fi
    - name: Prepare Apple artifacts
      run: |
        mkdir -p artifacts
        APP_PATH="$(find dist/apple/macos -maxdepth 1 -type d -name '*.app' | head -n 1)"
        APP_NAME="$(basename "$APP_PATH" .app)"
        ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "artifacts/${APP_NAME}-macos.zip"
        cp dist/apple/macos/*.dmg artifacts/
        cp dist/apple/ios/*-unsigned.ipa artifacts/
        cat > artifacts/MACOS-UNSIGNED-INSTALL.txt <<'EOF'
        This build is not notarized by Apple.
        If macOS blocks it, use one of these options:

        1) Right-click the app in Finder and choose "Open", then confirm.
        2) Or remove quarantine from Terminal:

        xattr -dr com.apple.quarantine /Applications/Rustysound.app
        open /Applications/Rustysound.app

        For public distribution, configure signing + notarization secrets in GitHub Actions.
        EOF
    - name: Upload Apple bundle artifacts
      uses: actions/upload-artifact@v7
      with:
        name: apple-bundles
        path: artifacts/*

  windows-bundles:
    needs: version
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - name: Sync Cargo.toml version to release version
      shell: bash
      run: |
        awk -v v='${{ needs.version.outputs.semver }}' '
          BEGIN { done=0 }
          !done && $0 ~ /^version = ".*"/ { print "version = \"" v "\""; done=1; next }
          { print }
        ' Cargo.toml > Cargo.toml.tmp
        mv Cargo.toml.tmp Cargo.toml
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Install Dioxus CLI
      run: cargo install dioxus-cli --version 0.7.10 --locked
    - name: Install Windows bundler tooling
      run: choco install nsis -y
    - name: Build Windows NSIS bundle
      run: dx bundle --windows --release --package-types nsis --out-dir dist/windows
    - name: Upload Windows bundle artifacts
      uses: actions/upload-artifact@v7
      with:
        name: windows-bundles
        path: |
          dist/windows/*.exe

  android-apks:
    needs: version
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Sync Cargo.toml version to release version
      run: |
        awk -v v='${{ needs.version.outputs.semver }}' '
          BEGIN { done=0 }
          !done && $0 ~ /^version = ".*"/ { print "version = \"" v "\""; done=1; next }
          { print }
        ' Cargo.toml > Cargo.toml.tmp
        mv Cargo.toml.tmp Cargo.toml
    - uses: dtolnay/rust-toolchain@stable
    - name: Add Android Rust targets
      run: |
        rustup target add aarch64-linux-android
        rustup target add x86_64-linux-android
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
    # The runner image ships the Android SDK. setup-android@v3 now fails while
    # accepting newer SDK licences, so use the preinstalled one directly.
    - name: Use the preinstalled Android SDK
      run: |
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
    - name: Install Android SDK components
      run: |
        # New licence types can make this exit non-zero; installs below still fail if one is missing.
        yes | sdkmanager --licenses >/dev/null || true
        sdkmanager \
          "platform-tools" \
          "platforms;android-33" \
          "platforms;android-34" \
          "build-tools;33.0.2" \
          "build-tools;34.0.0" \
          "ndk;26.3.11579264" \
          "cmake;3.22.1"
    - uses: Swatinem/rust-cache@v2
    - name: Install Dioxus CLI
      run: cargo install dioxus-cli --version 0.7.10 --locked
    - name: Build Android release APKs (ARM64 + x86_64)
      run: |
        export ANDROID_AAPT2_FROM_MAVEN_OVERRIDE="$ANDROID_HOME/build-tools/34.0.0/aapt2"
        export GRADLE_OPTS="-Dorg.gradle.project.android.aapt2FromMavenOverride=$ANDROID_AAPT2_FROM_MAVEN_OVERRIDE ${GRADLE_OPTS:-}"
        OUT_DIR="dist/android/aarch64-linux-android" ./scripts/bundle-android.sh --target aarch64-linux-android
        OUT_DIR="dist/android/x86_64-linux-android" ./scripts/bundle-android.sh --target x86_64-linux-android
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    - uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: "8.10.2"
    # 32-bit Android TVs can't run the native app (Dioxus 0.7 builds 64-bit
    # Android only); this small wrapper opens the web build with the same TV
    # bridge. Releases point it at GitHub Pages unless TV_WEB_URL is set.
    - name: Build Android TV wrapper APK
      run: |
        WEB_URL="${{ vars.TV_WEB_URL }}"
        if [[ -z "$WEB_URL" ]]; then
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          WEB_URL="https://${OWNER}.github.io/${{ github.event.repository.name }}/"
        fi
        VERSION="${{ needs.version.outputs.semver }}"
        gradle -p android/tv-wrapper assembleDebug -PwebUrl="$WEB_URL" -PversionName="${VERSION:-1.0}"
        mkdir -p dist/android/tv
        cp android/tv-wrapper/app/build/outputs/apk/debug/app-debug.apk "dist/android/tv/RustySound-TV.apk"
    - name: Collect Android release APKs
      run: |
        mkdir -p artifacts
        find dist/android -type f -name "*.apk" -print -exec cp {} artifacts/ \;
        if ! ls artifacts/*.apk >/dev/null 2>&1; then
          echo "No Android release APKs were collected." >&2
          exit 1
        fi
        ls -lah artifacts/
    - name: Upload Android APK artifacts
      uses: actions/upload-artifact@v7
      with:
        name: android-apks
        path: artifacts/*

  # Linux desktop: a portable tarball plus .deb and .rpm, so nobody has to
  # compile the app. ubuntu-22.04 keeps the glibc requirement low (2.35).
  #
  # Built with `dx build` (dx must link the binary for asset!() to resolve),
  # then packaged with nfpm from packaging/linux/nfpm.yaml. `dx bundle --linux`
  # isn't used: its deb/rpm put the binary in /usr/bin and assets in
  # /usr/lib/RustySound, and we want both together in /usr/lib/rustysound.
  # Dioxus resolves assets/ next to std::env::current_exe(), which follows the
  # /usr/bin/rustysound symlink.
  #
  # Release assets (VERSION has no leading "v"):
  #   RustySound-VERSION-linux-{x86_64,aarch64}.tar.gz
  #     RustySound-VERSION-linux-ARCH/{rustysound,assets/,rustysound.desktop,rustysound.png,LICENSE}
  #   rustysound_VERSION_{amd64,arm64}.deb
  #   rustysound-VERSION-1.{x86_64,aarch64}.rpm
  linux-bundles:
    needs: version
    name: linux-bundles (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    # The ARM build is a bonus: if it fails, the x86_64 packages still ship.
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            deb_arch: amd64
            rpm_arch: x86_64
            nfpm_tarball: nfpm_2.41.1_Linux_x86_64.tar.gz
            nfpm_sha256: b3cf95aa6dabed836d09ad7f0c190a13c74c5b1304db60846f0f702ee407f430
            optional: false
          - arch: aarch64
            runner: ubuntu-22.04-arm
            deb_arch: arm64
            rpm_arch: aarch64
            nfpm_tarball: nfpm_2.41.1_Linux_arm64.tar.gz
            nfpm_sha256: 17350a838c8e2c422c6e573ed379b18424565d2de8a2b1cb1b20211976124eb5
            optional: true
    env:
      VERSION: ${{ needs.version.outputs.semver }}
      LINUX_ARCH: ${{ matrix.arch }}
    steps:
    - uses: actions/checkout@v7
    - name: Sync Cargo.toml version to release version
      run: |
        awk -v v='${{ needs.version.outputs.semver }}' '
          BEGIN { done=0 }
          !done && $0 ~ /^version = ".*"/ { print "version = \"" v "\""; done=1; next }
          { print }
        ' Cargo.toml > Cargo.toml.tmp
        mv Cargo.toml.tmp Cargo.toml
    - name: Install Linux build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config curl file rpm desktop-file-utils \
          libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev \
          libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        key: linux-${{ matrix.arch }}
    - name: Install Dioxus CLI
      run: cargo install dioxus-cli --version 0.7.10 --locked
    - name: Install nfpm
      run: |
        set -euo pipefail
        curl -fsSL -o "$RUNNER_TEMP/nfpm.tar.gz" \
          "https://github.com/goreleaser/nfpm/releases/download/v2.41.1/${{ matrix.nfpm_tarball }}"
        echo "${{ matrix.nfpm_sha256 }}  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP" nfpm
        sudo install -m 0755 "$RUNNER_TEMP/nfpm" /usr/local/bin/nfpm
        nfpm --version
    # [profile.dist] in Cargo.toml: release + fat LTO, one codegen unit, stripped.
    - name: Build Linux desktop app
      run: dx build --linux --release --profile dist --no-default-features --features desktop
    - name: Stage tarball contents
      run: |
        set -euo pipefail
        APP_DIR="target/dx/rustysound/release/linux/app"
        if [[ ! -x "$APP_DIR/rustysound" ]]; then
          echo "dx output not found at $APP_DIR; searching target/dx:" >&2
          find target/dx -maxdepth 6 -type f -name rustysound >&2 || true
          exit 1
        fi

        NAME="RustySound-${VERSION}-linux-${LINUX_ARCH}"
        STAGE="dist/linux/${NAME}"
        rm -rf dist/linux
        mkdir -p "$STAGE/assets" dist/linux/out

        install -m 0755 "$APP_DIR/rustysound" "$STAGE/rustysound"
        # The desktop build links icons and the web manifest by their plain
        # /assets/... paths (src/main.rs), so ship the source assets, then lay
        # dx's processed asset!() output (hashed names) over them.
        cp -R assets/. "$STAGE/assets/"
        rm -f "$STAGE/assets/favicon.icns"
        if [[ -d "$APP_DIR/assets" ]]; then
          cp -R "$APP_DIR/assets/." "$STAGE/assets/"
        fi
        install -m 0644 packaging/linux/rustysound.desktop "$STAGE/rustysound.desktop"
        install -m 0644 assets/web-app-manifest-512x512.png "$STAGE/rustysound.png"
        install -m 0644 LICENSE "$STAGE/LICENSE"

        echo "STAGE=$PWD/$STAGE" >> "$GITHUB_ENV"
        echo "NAME=$NAME" >> "$GITHUB_ENV"

        file "$STAGE/rustysound"
        ls -lh "$STAGE/rustysound"
        echo "Highest glibc symbol version required:"
        objdump -T "$STAGE/rustysound" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1
        if ldd "$STAGE/rustysound" | grep 'not found'; then
          echo "Unresolved shared libraries." >&2
          exit 1
        fi
        find "$STAGE" -type f | sort
    - name: Build tarball, .deb and .rpm
      env:
        PKG_ARCH: ${{ matrix.deb_arch }}
      run: |
        set -euo pipefail
        tar --owner=0 --group=0 --numeric-owner -C dist/linux \
          -czf "dist/linux/out/${NAME}.tar.gz" "${NAME}"
        nfpm package -f packaging/linux/nfpm.yaml -p deb \
          -t "dist/linux/out/rustysound_${VERSION}_${{ matrix.deb_arch }}.deb"
        nfpm package -f packaging/linux/nfpm.yaml -p rpm \
          -t "dist/linux/out/rustysound-${VERSION}-1.${{ matrix.rpm_arch }}.rpm"
        ls -lh dist/linux/out
    - name: Check packages
      run: |
        set -euo pipefail
        cd dist/linux/out
        tar -tzf "${NAME}.tar.gz" | sort
        dpkg-deb --info "rustysound_${VERSION}_${{ matrix.deb_arch }}.deb"
        dpkg-deb --contents "rustysound_${VERSION}_${{ matrix.deb_arch }}.deb"
        rpm -qip "rustysound-${VERSION}-1.${{ matrix.rpm_arch }}.rpm"
        rpm -qRp "rustysound-${VERSION}-1.${{ matrix.rpm_arch }}.rpm"
        rpm -qlp "rustysound-${VERSION}-1.${{ matrix.rpm_arch }}.rpm"

        # Install the .deb on this runner: checks the dependency names resolve
        # and the installed layout matches what Dioxus looks for.
        sudo apt-get install -y "./rustysound_${VERSION}_${{ matrix.deb_arch }}.deb"
        test -L /usr/bin/rustysound
        test "$(readlink -f /usr/bin/rustysound)" = /usr/lib/rustysound/rustysound
        test -x /usr/lib/rustysound/rustysound
        test -f /usr/lib/rustysound/assets/favicon.svg
        test -f /usr/share/applications/rustysound.desktop
        test -f /usr/share/icons/hicolor/512x512/apps/rustysound.png
        if ldd /usr/lib/rustysound/rustysound | grep 'not found'; then
          echo "Unresolved shared libraries after install." >&2
          exit 1
        fi
        desktop-file-validate /usr/share/applications/rustysound.desktop
    - name: Upload Linux bundle artifacts
      uses: actions/upload-artifact@v7
      with:
        name: linux-bundles-${{ matrix.arch }}
        path: |
          dist/linux/out/*.tar.gz
          dist/linux/out/*.deb
          dist/linux/out/*.rpm
        if-no-files-found: error

  release:
    needs: [version, web-docker, web-pages, apple-bundles, windows-bundles, android-apks, linux-bundles]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts/
    - name: List artifacts
      run: find artifacts -type f
    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.version.outputs.tag }}
        name: Release ${{ needs.version.outputs.tag }}
        generate_release_notes: true
        draft: false
        prerelease: false
        files: |
          artifacts/**/*.dmg
          artifacts/**/*.ipa
          artifacts/**/*.exe
          artifacts/**/*.apk
          artifacts/**/*.tar.gz
          artifacts/**/*.deb
          artifacts/**/*.rpm
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Dispatch package updates
      env:
        DISPATCH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
        VERSION: ${{ needs.version.outputs.tag }}
        PACKAGES_REPO: ${{ vars.PACKAGES_REPO }}
        LINUX_PACKAGES_REPO: ${{ vars.LINUX_PACKAGES_REPO }}
      run: |
        set -euo pipefail

        if [[ -z "${DISPATCH_TOKEN}" ]]; then
          echo "CROSS_REPO_DISPATCH_TOKEN is not set, skipping package dispatch."
          exit 0
        fi

        PACKAGES_REPO="${PACKAGES_REPO:-${LINUX_PACKAGES_REPO:-AD-Archer/packages}}"
        PAYLOAD="{\"event_type\":\"rustysound-release\",\"client_payload\":{\"version\":\"${VERSION}\",\"source_repo\":\"${GITHUB_REPOSITORY}\",\"source_sha\":\"${GITHUB_SHA}\"}}"

        dispatch_repo() {
          local repo="$1"
          local name="$2"
          if [[ -z "${repo}" ]]; then
            echo "${name} repo not configured; skipping."
            return 0
          fi
          echo "Dispatching to ${name}: ${repo}"
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            "https://api.github.com/repos/${repo}/dispatches" \
            -d "${PAYLOAD}"
        }

        dispatch_repo "AD-Archer/homebrew-tap" "Homebrew tap"
        dispatch_repo "AD-Archer/scoop" "Scoop bucket"
        dispatch_repo "${PACKAGES_REPO}" "Packages"
