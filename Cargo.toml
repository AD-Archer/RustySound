[package]
name = "rustysound"
version = "3.0.0"
authors = ["ad-archer <antonioarcher.dev@gmail.com>"]
edition = "2021"
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.3", features = ["router"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
md5 = "0.7"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "js"] }
urlencoding = "2.1"
getrandom = { version = "0.2", features = ["js"] }
base64 = "0.22"
futures-util = "0.3"
once_cell = "1.19"
rand = "0.8"

# Server-side dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.41", features = ["bundled"] }
dirs = "5.0"
png = "0.17"
# The sync server's WebSocket (src/components/remote_sync); rustls, like reqwest.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc = "0.2"

# Android: JNI calls into the Media3 playback service
# (src/components/audio_manager/native_android_backend.rs) and for the app's
# private folders (src/storage.rs), and manganis's `ffi` declaration that has
# dx bundle android/rustysound-audio into the APK. All three already come in
# through dioxus; keep manganis on the dioxus version.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
manganis = "=0.7.10"

# Music stored on the device (src/local_music): tag reading on Mac and iPhone,
# the folder picker and folder watching on the Mac app only.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
lofty = "0.25.5"
# Casting to network speakers (src/cast): XML for UPnP descriptions and SOAP
# replies, and TLS for Google Cast. rustls and tokio-rustls already come in
# through reqwest; they're named here for the Cast connection.
roxmltree = "0.21"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "0.17.2", optional = true }
notify = { version = "8.2.1", optional = true, default-features = false, features = ["macos_fsevent"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.60", features = ["Foundation", "Media", "Media_Core", "Media_Playback", "Storage_Streams"] }

# Client-side dependencies  
[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
web-sys = { version = "0.3", features = ["HtmlAudioElement", "Storage", "Window", "Document", "Element"] }
js-sys = "0.3"
gloo-storage = "0.3"
gloo-net = "0.7"
gloo-timers = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop", "dep:rfd", "dep:notify"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[package.metadata.bundle]
name = "RustySound"
identifier = "app.adarcher.rustysound"
icon = [
    "assets/favicon.ico",
    "assets/favicon.icns",
    "assets/web-app-manifest-512x512.png",
]


# Smaller, faster Linux desktop release builds (the linux-bundles job in
# .github/workflows/build.yml runs `dx build --profile dist`). A separate
# profile so the web, Apple, Windows and Android builds, which dx gives its
# own *-release profiles inheriting [profile.release], are unchanged.
# strip is safe with dx: it builds with strip=false, reads the asset!() link
# sections, then strips the binary itself. panic stays "unwind" so a panic in
# a spawned task or an event handler doesn't take the whole app down.
[profile.dist]
inherits = "release"
strip = true
lto = "fat"
codegen-units = 1
